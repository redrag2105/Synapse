services:
  admin-api:
    build:
      context: ./admin-api
    env_file:
      - path: ./admin-api/.env
        required: false
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-web:
    build:
      context: ./admin-web
    env_file:
      - path: ./admin-web/.env.local
        required: false
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      admin-api:
        condition: service_healthy
